name: Weather dashboard tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'prototype/weather-dashboard/**'
      - '.github/workflows/weather-dashboard-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node prototype/weather-dashboard/tests/chart-model.test.cjs
      - run: pip install -r prototype/weather-dashboard/requirements.txt
      - run: python -m unittest discover -s prototype/weather-dashboard/tests -v
