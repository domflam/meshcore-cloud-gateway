name: Cloud ingestion tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cloud/**'
      - '.github/workflows/cloud-ingestion-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r cloud/requirements.txt
      - run: python -m unittest discover -s cloud/tests -v
