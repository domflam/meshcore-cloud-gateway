name: LAB Heltec V3 WiFi telemetry
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/heltec-lab-wifi.yml'

jobs:
  build-lab-wifi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: gat562
            node_id: GAT562-01
            public_key: 26b5986ec521b62b9811688513f9a720b5245cd9448f90d4cbe3e0ca23c817ca
            profile: legacy
          - target: rak4631
            node_id: RAK4631-LAB
            public_key: 9222cc51c4ad973798dab0e1e5d49630948a6e1f0b3576a059774e1d0d53ebb7
            profile: rak-simulated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: gateway
      - uses: actions/checkout@v4
        with:
          repository: meshcore-dev/MeshCore
          ref: 81dbae592ffad40b4212bc0b37e82b38da08f4bc # pinned MeshCore baseline
          submodules: recursive
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade platformio
      - name: Inject telemetry scheduler and decoder into WiFi Companion
        shell: bash
        run: |
          cp gateway/firmware/include/TelemetryScheduler.h upstream/examples/companion_radio/TelemetryScheduler.h
          cp gateway/firmware/include/TelemetryDecoder.h upstream/examples/companion_radio/TelemetryDecoder.h
          cp gateway/firmware/include/GatewayCloudUplink.h upstream/examples/companion_radio/GatewayCloudUplink.h
          cp gateway/firmware/include/GatewayWifiProvisioning.h upstream/examples/companion_radio/GatewayWifiProvisioning.h
          python gateway/firmware/scripts/apply_lab_patch.py upstream \
            --node-id '${{ matrix.node_id }}' \
            --public-key '${{ matrix.public_key }}' \
            --profile '${{ matrix.profile }}'
          python gateway/firmware/scripts/enable_wifi_provisioning.py upstream
          python - <<'PY'
          from pathlib import Path
          p = Path('upstream/variants/heltec_v3/platformio.ini')
          data = p.read_text()
          header = '[env:Heltec_v3_companion_radio_wifi]'
          before, after = data.split(header, 1)
          section, rest = after.split('[env:', 1)
          old = '  ${Heltec_lora32_v3.build_flags}'
          assert section.count(old) == 1
          section = section.replace(old, old + '\n  -D CLOUD_GATEWAY_LAB_POLL=1\n  -D CLOUD_GATEWAY_LAB_UPLINK=1\n  -D CLOUD_GATEWAY_POLL_INTERVAL_MS=600000', 1)
          section = section.replace('  densaugeo/base64 @ ~1.4.0', '  densaugeo/base64 @ ~1.4.0\n  WiFi\n  WebServer\n  DNSServer\n  Preferences\n  WiFiClientSecure\n  HTTPClient', 1)
          p.write_text(before + header + section + '[env:' + rest)
          PY
      - name: Compile WiFi gateway
        run: pio run -d upstream -e Heltec_v3_companion_radio_wifi
      - name: Upload test firmware
        uses: actions/upload-artifact@v4
        with:
          name: heltec-v3-wifi-${{ matrix.target }}-lab
          path: upstream/.pio/build/Heltec_v3_companion_radio_wifi/*.bin
          if-no-files-found: error
