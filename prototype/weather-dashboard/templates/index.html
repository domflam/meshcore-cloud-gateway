<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Météo du Club — prototype</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e9f1f4;background:#0c1822}body{max-width:880px;margin:0 auto;padding:28px 18px}h1{font-size:1.6rem}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#192b38;border:1px solid #324956;border-radius:16px;padding:20px}.label{color:#a6beca;font-size:.85rem}.value{font-size:2.4rem;font-weight:700;margin-top:8px}svg{width:100%;height:230px;overflow:visible}.chart{margin-top:18px}.muted{color:#9eb6c2}#status{margin-bottom:18px}
</style></head><body>
<h1>🌤️ Météo du Club <small class="muted">· prototype</small></h1>
<p id="status" class="muted">Chargement des mesures…</p>
<main><section class="card"><div class="label">Température</div><div id="temp" class="value">—</div></section>
<section class="card"><div class="label">Batterie du nœud</div><div id="battery" class="value">—</div></section>
<section class="card"><div class="label">Dernière mesure</div><div id="last" class="value" style="font-size:1.2rem">—</div></section></main>
<section class="card chart"><strong>Température · dernières 24 h</strong><svg id="plot" viewBox="0 0 700 230" role="img" aria-label="Courbe de température"></svg><p id="range" class="muted"></p></section>
<script>
const fmt=(n,unit,d=1)=>Number.isFinite(Number(n))?Number(n).toFixed(d).replace('.',',')+' '+unit:'—';
async function refresh(){
 try{
 const response=await fetch('/api/weather',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);
 const data=await response.json(),last=data.latest;
 document.getElementById('status').textContent=last?'Données réelles · nœud '+last.node:'Aucune mesure sur les dernières 24 heures';
 document.getElementById('temp').textContent=last?fmt(last.temperature,'°C'):'—';
 document.getElementById('battery').textContent=last?fmt(last.voltage,'V',2):'—';
 document.getElementById('last').textContent=last?new Date(last.time).toLocaleString('fr-FR'):'—';
 const pts=data.history.filter(p=>p.temperature!==null&&Number.isFinite(Number(p.temperature))).map(p=>({t:new Date(p.time).getTime(),v:Number(p.temperature)})).filter(p=>Number.isFinite(p.t));
 const svg=document.getElementById('plot');svg.replaceChildren();
 if(pts.length<2){document.getElementById('range').textContent='Pas encore assez de points pour tracer une courbe.';return;}
 const min=Math.min(...pts.map(p=>p.v)),max=Math.max(...pts.map(p=>p.v)),t0=pts[0].t,t1=pts[pts.length-1].t;
 const x=p=>25+650*(p.t-t0)/(t1-t0||1),y=p=>200-165*(p.v-min)/(max-min||1);
 const line=document.createElementNS('http://www.w3.org/2000/svg','polyline');
 line.setAttribute('points',pts.map(p=>x(p)+','+y(p)).join(' '));line.setAttribute('fill','none');line.setAttribute('stroke','#6ed8c0');line.setAttribute('stroke-width','3');line.setAttribute('stroke-linejoin','round');svg.append(line);
 document.getElementById('range').textContent='Min '+fmt(min,'°C')+' · Max '+fmt(max,'°C')+' · '+pts.length+' mesures';
 }catch(e){document.getElementById('status').textContent='Erreur de lecture : '+e.message;}
}
refresh();setInterval(refresh,60000);
</script></body></html>
